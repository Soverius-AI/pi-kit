name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node --test e2e/backend-lifecycle.e2e.mjs e2e/browser.desktop.e2e.mjs

  linux-desktop-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check silent AppImage updates and permission handling
        working-directory: libs/shared/service-host
        run: pnpm exec vitest run src/linux-app-update.spec.ts src/desktop-update-cli.spec.ts

  windows-install:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Keep the linker flags aligned with the Windows release job.
      - run: pnpm install --frozen-lockfile --node-linker=isolated --shamefully-hoist
      - run: node --test scripts/dependency-contract.spec.mjs
      - name: Check silent desktop updates and parse the Windows helper
        working-directory: libs/shared/service-host
        run: pnpm exec vitest run src/windows-desktop-update.spec.ts src/desktop-update-cli.spec.ts
