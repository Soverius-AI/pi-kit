# Release builds.
#
#   mac      macos-15 (Apple Silicon)   pnpm run release --only mac   -> pi-kit-<v>-mac-arm64.dmg + .zip, latest-mac.yml
#   windows  windows-latest (x64)       pnpm run release --only win   -> pi-kit-<v>-win-x64.exe + -portable.exe, pi-kit-<v>-win-arm64.exe + -portable.exe, latest.yml
#                                       (one run packs both architectures so latest.yml lists both installers; the arm64 build is a cross build)
#   linux    ubuntu-22.04 / -arm       native x64 and arm64 AppImages, latest-linux.yml / latest-linux-arm64.yml
#   Each job also writes the server tarballs of its platform (scripts/package-server.mjs): mac darwin-arm64 and darwin-x64,
#   windows win32-x64 and win32-arm64 (.zip), linux its own; pi-kit-server-<v>-<target>.tar.gz.
#   publish  ubuntu-latest              on a `v*` tag push: automatically publish a GitHub release holding every file, and
#                                       SHA256SUMS over the six server tarballs, which `pi-kit update` checks.
#   npm      ubuntu-latest              @soverius-ai/pi-kit and @soverius-ai/pi-kit-<target>, written from the six server tarballs
#                                       (scripts/package-npm.mjs) and installed and run on every run; published on a `v*` tag push.
#   deploy-onboarding ubuntu-latest     after publish on a tag push: ask Coolify to rebuild remote.pi-kit.dev from the tagged commit.
#
# Triggers: a `v*` tag push builds every target without smoke tests, then publishes the release. Manual runs build without publishing; smoke tests are opt-in.
# Cut a release: set "version" in package.json, commit, `git tag v<version> && git push origin v<version>`. Preflight refuses a tag that differs from package.json before any builds start.
#
# What each build job checks (scripts/release.mjs and scripts/release-smoke.mjs):
#   - the natives of every target triple are the right ones (file headers; loaded in Electron for the runner's own target), see scripts/natives.mjs
#   - only on manual runs with smoke_tests enabled, the smoke test launches the packaged app of the runner's own target with a scratch agent folder, a local fake model, a file secret store and PI_OFFLINE=1,
#     opens a thread, sends one prompt, asserts the answer and quits. The Windows arm64 build cannot run on an x64 runner: it gets the header checks only.
#
# Tag releases require macOS signing, a provisioning profile and notarization credentials (checked in preflight).
# Signing is optional for manual builds. Without any of the secrets below the builds are unsigned: macOS is ad-hoc signed (runs on the machine that built it, and after
# "Open anyway" elsewhere; Gatekeeper rejects it), Windows is unsigned (SmartScreen warns). Electron-updater only installs updates of a build
# whose signature matches on macOS, so signed releases are what makes the in-app update work for other people.
#
#   macOS signing      secret MAC_CSC_LINK          base64 of a "Developer ID Application" .p12 (or an https URL to it)
#                      secret MAC_CSC_KEY_PASSWORD  the .p12's password
#                      secret APPLE_TEAM_ID         signing team's ID (also needed with API-key notarization)
#                      secret MAC_PROVISIONING_PROFILE_BASE64  profile for dev.pi-kit.app with Keychain Sharing
#   macOS notarising   variable PI_KIT_NOTARIZE=1   (Settings > Secrets and variables > Actions > Variables), plus either
#                      secrets APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID,
#                      or an App Store Connect API key: secrets APPLE_API_KEY_BASE64 (the .p8 file, base64; the step below writes it out and points
#                      APPLE_API_KEY at it) + APPLE_API_KEY_ID + APPLE_API_ISSUER
#   Windows signing    secret WIN_CSC_LINK          base64 of a code-signing .pfx (or an https URL), secret WIN_CSC_KEY_PASSWORD
#   npm                secret NPM_TOKEN             an npm token that may publish the @soverius-ai packages (required for tag releases)
#                      (an EV/HSM or Azure Trusted Signing setup needs electron-builder's `win.azureSignOptions` / a custom sign hook, not wired here)
# electron-builder reads CSC_LINK / CSC_KEY_PASSWORD for macOS and WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD for Windows; the jobs below map the secrets onto them.
#
# Installed apps look for updates in the repository that built them (PI_KIT_UPDATE_REPO, read by electron-builder.config.cjs `publish`),
# so it must be public. The publish job refuses a build whose app-update.yml names another repository.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      smoke_tests:
        description: Run packaged-app smoke tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  # Never let electron-builder go looking for a signing identity on its own; the config picks CSC_NAME / CSC_LINK or ad-hoc signs.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PI_KIT_UPDATE_REPO: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag version and required macOS release credentials
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PI_KIT_NOTARIZE: ${{ vars.PI_KIT_NOTARIZE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MAC_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID NPM_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required release secret $name is missing"
              missing=1
            fi
          done
          if [ "$PI_KIT_NOTARIZE" != "1" ]; then
            echo "::error::Repository variable PI_KIT_NOTARIZE must be 1 for tag releases"
            missing=1
          fi
          # Match mac-notarization.cjs: any Apple ID credential selects Apple ID authentication.
          if [ -n "$APPLE_ID" ] || [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
              echo "::error::Apple ID notarization requires both APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD"
              missing=1
            fi
          elif ! { [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; }; then
            echo "::error::Provide complete App Store Connect API notarization credentials when Apple ID credentials are absent"
            missing=1
          fi
          exit "$missing"

  mac:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from `packageManager` in package.json. No store cache: a restored store once lacked files of
      # better-sqlite3-multiple-ciphers and broke the mac packaging, and a fresh install is only seconds slower.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Notarisation API key file (only when APPLE_API_KEY_BASE64 is set)
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          fi
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - name: Keychain Sharing provisioning profile
        run: |
          if [ -n "$MAC_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/pi-kit.provisionprofile"
            echo "PI_KIT_MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/pi-kit.provisionprofile" >> "$GITHUB_ENV"
          fi
        env:
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
      - name: Build the macOS app (Apple Silicon)
        run: pnpm run release --only mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          PI_KIT_NOTARIZE: ${{ vars.PI_KIT_NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # The zip is what electron-updater installs.
      - name: Smoke test (zip)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tests }}
        run: node scripts/release-smoke.mjs dist/release/pi-kit-*-mac-arm64.zip
      # Intel Macs get the server only; its backend is staged from the same build. The archives join dist/release because
      # upload-artifact keeps the paths below the files' common folder, and the publish job takes every file from the top.
      - name: Server tarballs (darwin-arm64, darwin-x64)
        run: |
          node scripts/package-stage.mjs --skip-build --target darwin-x64
          node scripts/package-server.mjs --target darwin-arm64 --target darwin-x64
          mv dist/server/pi-kit-server-* dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          if-no-files-found: error
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.blockmap
            dist/release/latest-mac.yml
            dist/release/pi-kit-server-*

  windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from `packageManager` in package.json. No store cache: a restored store once lacked files of
      # better-sqlite3-multiple-ciphers and broke the mac packaging, and a fresh install is only seconds slower.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Avoid pnpm's hoisted importer on Windows: importing nested packages can fail with
      # ENOENT when renaming _tmp_* directories (seen with the SQLite alias under @ag-ui/client).
      # Public hoisting keeps root node_modules lookups used by Nx and the build scripts working.
      - run: pnpm install --frozen-lockfile --node-linker=isolated --shamefully-hoist
      - name: Build the Windows apps (x64 and arm64)
        run: pnpm run release --only win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Evidence for the intermittent "Missing built native loader better-sqlite3-multiple-ciphers": `pnpm run` re-imports
      # node_modules with the hoisted importer the install above avoids; this shows what it left and what the bundle holds.
      - name: SQLite package and natives bundle (on failure)
        if: failure()
        run: |
          ls -la node_modules/better-sqlite3-multiple-ciphers node_modules/better-sqlite3-multiple-ciphers/lib || true
          find node_modules -maxdepth 5 -type d -name better-sqlite3-multiple-ciphers || true
          ls -laR dist/apps/backend-runtime-natives/node_modules | head -60 || true
      # The x64 runner cannot launch the arm64 build; that one only gets the release step's header checks.
      - name: Smoke test (x64, the unpacked app)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tests }}
        run: node scripts/release-smoke.mjs dist/release/win-unpacked
      # Silent install into a temp folder (NSIS /S /D=), launch, uninstall. continue-on-error until it has passed once.
      - name: Smoke test (x64 installer)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tests }}
        continue-on-error: true
        run: node scripts/release-smoke.mjs dist/release/pi-kit-*-win-x64.exe
      - name: Server zips (win32-x64, win32-arm64)
        run: |
          node scripts/package-server.mjs --target win32-x64 --target win32-arm64
          mv dist/server/pi-kit-server-* dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/release/*.exe
            dist/release/*.blockmap
            dist/release/latest.yml
            dist/release/pi-kit-server-*

  linux:
    needs: preflight
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            appimageArch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            appimageArch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node-pty compiles during install (allowBuilds); Electron needs desktop libraries.
      - name: Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libgtk-3-0 libnss3 libasound2 libgbm1 libsecret-1-0 libxtst6 libxss1
      - name: Linux smoke-test display dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tests }}
        run: sudo apt-get install -y xvfb xauth
      - run: pnpm install --frozen-lockfile
      - name: Build the Linux AppImage
        run: pnpm run release --only linux-${{ matrix.arch }}
      # Extract the actual AppImage without FUSE, then exercise its packaged app on the matching CPU under Xvfb.
      - name: Smoke test (AppImage)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_tests }}
        run: xvfb-run -a node scripts/release-smoke.mjs dist/release/pi-kit-*-linux-${{ matrix.appimageArch }}.AppImage
      - name: Server tarball (linux-${{ matrix.arch }})
        run: |
          node scripts/package-server.mjs --target linux-${{ matrix.arch }}
          mv dist/server/pi-kit-server-* dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/release/*.AppImage
            dist/release/latest-linux*.yml
            dist/release/pi-kit-server-*

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # All platforms share the publish config; the mac zip is the copy readable here without running it.
      - name: The update feed must be this repository
        run: |
          feed="$(unzip -p release/pi-kit-*-mac-arm64.zip pi-kit.app/Contents/Resources/app-update.yml)"
          owner="$(printf '%s\n' "$feed" | sed -n 's/^owner: //p')"
          repo="$(printf '%s\n' "$feed" | sed -n 's/^repo: //p')"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::the app looks for updates in $owner/$repo, but this release goes to $GITHUB_REPOSITORY"
            exit 1
          fi
      - name: Every server tarball, and their SHA256SUMS
        run: |
          cd release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            case $target in win32-*) ext=zip ;; *) ext=tar.gz ;; esac
            archive="pi-kit-server-${GITHUB_REF_NAME#v}-$target.$ext"
            if [ ! -f "$archive" ]; then
              echo "::error::$archive is missing"
              exit 1
            fi
          done
          sha256sum pi-kit-server-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release (or replace assets on rerun)
        run: |
          ls -l release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "pi-kit $GITHUB_REF_NAME" --generate-notes release/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Every run: the npm packages from this run's server tarballs, installed as a user would and run. A `v*` tag push publishes
  # them with provenance, the platform packages before the launcher that names them; a version npm already has is skipped,
  # so a rerun publishes only what is missing.
  npm:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write the npm packages
        run: node scripts/package-npm.mjs --from release --out npm
      - name: Install the launcher and linux-x64 package as a user would, and run pi-kit
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir packs
          npm pack ./npm/linux-x64 ./npm/pi-kit --pack-destination packs
          npm install -g --prefix "$RUNNER_TEMP/pi-kit" ./packs/*.tgz # without ./ npm reads packs/<file> as a GitHub repository
          reported="$(PI_KIT_DATA_DIR="$RUNNER_TEMP/pi-kit-data" "$RUNNER_TEMP/pi-kit/bin/pi-kit" --version)"
          echo "$reported"
          [ "$reported" = "pi-kit $version" ]
      - name: Publish to npm
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case $version in *-*) tag=next ;; *) tag=latest ;; esac
          for dir in npm/darwin-* npm/linux-* npm/win32-* npm/pi-kit; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish "./$dir" --access public --provenance --tag "$tag"
          done

  # remote.pi-kit.dev follows the tag: Coolify rebuilds the onboarding site from the tagged commit once the release is public,
  # so its download link never points at a release that does not exist yet. Needs the three COOLIFY_* secrets (doc/docs/remote-onboarding-site.md).
  deploy-onboarding:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_ONBOARDING_UUID: ${{ secrets.COOLIFY_ONBOARDING_UUID }}
    steps:
      - name: Pin the Coolify application to this tag's commit and deploy it
        shell: bash
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_ONBOARDING_UUID" ]; then
            echo "::notice::COOLIFY_URL, COOLIFY_TOKEN or COOLIFY_ONBOARDING_UUID is not set; remote.pi-kit.dev was not deployed"
            exit 0
          fi
          api="${COOLIFY_URL%/}/api/v1"
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          curl --fail --silent --show-error -X PATCH "$api/applications/$COOLIFY_ONBOARDING_UUID" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"git_commit_sha\":\"$GITHUB_SHA\"}" >/dev/null
          curl --fail --silent --show-error -X POST "$api/deploy?uuid=$COOLIFY_ONBOARDING_UUID&force=true" -H "$auth"
          echo
          echo "::notice::Coolify is deploying remote.pi-kit.dev from $GITHUB_REF_NAME ($GITHUB_SHA)"
