<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- pi-kit app icon: the πk ligature (pi's right leg is the k's stem) cut into sixteen facets, warm golds with amber-orange and
       copper on the k's arms, the folds lit with a hairline of light, on the design system's dark base. Master for
       icon.png (electron-builder derives .ico from it; regenerate .icns on macOS with pnpm run build:mac-icon). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3038"/><stop offset="1" stop-color="#14161a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.6"><stop offset="0" stop-color="#e3b457" stop-opacity="0.18"/><stop offset="1" stop-color="#e3b457" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#e3b457" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <rect x="80" y="80" width="864" height="430" rx="184" fill="url(#sheen)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#3d414b" stroke-width="8"/>
  <g transform="translate(96 92) scale(8.6)" stroke="rgb(255 255 255 / .22)" stroke-width=".45" stroke-linejoin="round" filter="url(#emboss)">
    <polygon points="12,30 40,30 22,41.5" fill="#f6d98c"/>
    <polygon points="12,30 22,41.5 12,41.5" fill="#e6a94a"/>
    <polygon points="22,41.5 40,30 52,41.5" fill="#c58f3a"/>
    <polygon points="40,30 68,30 52,41.5" fill="#fbe3a0"/>
    <polygon points="52,41.5 68,30 68,41.5" fill="#b4772e"/>
    <polygon points="23,41.5 34.5,41.5 23,60" fill="#edbf63"/>
    <polygon points="34.5,41.5 34.5,76.5 23,60" fill="#b98332"/>
    <polygon points="23,60 34.5,76.5 23,76.5" fill="#e2a94c"/>
    <polygon points="52,20 63.5,20 52,45" fill="#f9dd93"/>
    <polygon points="63.5,20 63.5,50 52,45" fill="#d19a3c"/>
    <polygon points="52,45 63.5,50 52,82" fill="#e9b85a"/>
    <polygon points="63.5,50 63.5,82 52,82" fill="#a06f28"/>
    <polygon points="63.5,58 80,40 88,48" fill="#f4c96e"/>
    <polygon points="63.5,58 88,48 71.5,64" fill="#e2893f"/>
    <polygon points="63.5,68 71.5,63 88,81" fill="#dfa84a"/>
    <polygon points="63.5,68 88,81 80,89" fill="#c46b3a"/>
  </g>
</svg>
