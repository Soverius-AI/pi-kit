services:
  onboarding:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: pi-kit-onboarding
    restart: unless-stopped
    volumes:
      - ./browser:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    labels:
      traefik.enable: 'true'
      traefik.docker.network: coolify
      traefik.http.routers.pi-kit-onboarding-http.entryPoints: http
      traefik.http.routers.pi-kit-onboarding-http.rule: Host(`remote.pi-kit.dev`)
      traefik.http.routers.pi-kit-onboarding-http.middlewares: redirect-to-https
      traefik.http.routers.pi-kit-onboarding.entryPoints: https
      traefik.http.routers.pi-kit-onboarding.rule: Host(`remote.pi-kit.dev`)
      traefik.http.routers.pi-kit-onboarding.tls: 'true'
      traefik.http.routers.pi-kit-onboarding.tls.certresolver: letsencrypt
      traefik.http.routers.pi-kit-onboarding.middlewares: gzip
      traefik.http.services.pi-kit-onboarding.loadbalancer.server.port: '8080'
networks:
  coolify:
    external: true
