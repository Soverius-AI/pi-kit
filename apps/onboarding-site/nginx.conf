server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;
    disable_symlinks on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location = /health {
        default_type text/plain;
        return 200 'ok\n';
    }
    location ~ (^|/)\. { deny all; }
    location = /index.html {
        expires -1;
    }
    location /i18n/ {
        expires -1;
    }
    location / {
        expires 30d;
        try_files $uri $uri/ =404;
    }
}
