                x-line-schema:
                  $ref: '#/components/schemas/PiBashContent'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A shell command is already running in this thread.
