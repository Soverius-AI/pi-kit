  /api/workspaces/{id}/tree:
    get:
      description: Lists the entries under `dir` (the root without it), ignore-aware and folders first. `ignored=1` lists what git ignores too.
      operationId: Session_workspaceTree
      parameters:
        - name: id
          required: true
          in: path
          description: The project's folder, URL-encoded (a project has no other id).
          schema:
            type: string
        - name: dir
          required: false
          in: query
          schema:
            type: string
        - name: ignored
          required: false
          in: query
          schema:
            type: string
