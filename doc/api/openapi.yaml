  /api/skill-drafts/{id}/verify:
    get:
      description: 'Says what a verification of the draft would do: the thread’s first prompt (the one it will send, which the person may edit), the commit it starts from, the files of the outcome it is compared with, the checks of the original thread it runs again, the model, and whether it can start now and, if not, why. The record of the last verification is `verification` of the draft.'
      operationId: Learn_plan
      parameters:
        - name: id
          required: true
          in: path
          description: The draft id, from `draft.id` of a thread state.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPlan'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Plan a verification
      tags:
        - learn
    post:
      description: Makes a scratch worktree at the outcome’s base commit, starts a thread there with the draft pinned as a skill and the thread’s first prompt, and, when it is done, compares the result with the outcome (files and hunks, a similarity score) and runs the original thread’s checks again. Answers at once with the draft, whose `verification` is `running`; read it again (or the thread state) for the report. `text` and `name` are the person’s edits in the dialog (a pending draft only); `prompt` replaces the first prompt. Nothing is pushed or merged, the main checkout is not touched, and the scratch worktree is removed afterwards.
      operationId: Learn_start
      parameters:
        - name: id
          required: true
          in: path
          description: The draft id, from `draft.id` of a thread state.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartVerify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDraft'
        '400':
          description: The edited text is not a skill pi would load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'The draft cannot be verified now: no outcome, discarded, another verification is running, or the commits are gone.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Verify a skill draft by replaying it
      tags:
        - learn
