openapi: 3.1.0
info:
  title: pi-kit backend
  description: 'The loopback HTTP API of the pi-kit backend. Every request carries `Authorization: Bearer <token>`; the token is made per launch and handed to the renderer. The schemas come from `libs/shared/protocol`; this file is generated by `pnpm run api:openapi` and checked by `pnpm run check`, never edited by hand.'
  version: 0.1.0
  contact: {}
servers: []
security:
  - bearer: []
tags: []
paths:
  /api/health:
    get:
      description: Answers that the backend is up, with the id of this process and when it started, and whether this backend runs background agents (a second backend on the same data folder does not). A client that sees the boot id change knows the backend restarted.
      operationId: Health_health
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Check the backend
      tags:
        - app
  /api/openapi.json:
    get:
      description: Returns this OpenAPI document, as the backend built it at boot.
      operationId: OpenApi_document
      parameters: []
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The document is not built yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get the API document
      tags:
        - contract
  /api/threads/{id}/browser:
    get:
      description: The current page of this chat. Available only when the desktop app hosts the backend.
      operationId: Browser_state
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserState'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get the browser artifact
      tags:
        - browser
  /api/threads/{id}/browser/action:
    post:
      description: Navigate or inspect the same isolated browser page the user sees in Artifacts. Element references come from a recent accessibility snapshot.
      operationId: Browser_action
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - navigate
                    - snapshot
                    - click
                    - fill
                    - press
                    - scroll
                    - evaluate
                    - screenshot
                    - inspect
                    - console
                    - clear-console
                    - back
                    - forward
                    - reload
                    - close
                url:
                  description: HTTP(S) URL for navigate, including localhost dev servers.
                  type: string
                  maxLength: 8192
                ref:
                  description: Element reference from the most recent snapshot, required for click and fill.
                  type: string
                  maxLength: 80
                text:
                  description: Text for fill.
                  type: string
                  maxLength: 100000
                key:
                  description: 'Key for press: Enter, Tab, Escape, ArrowDown, etc.'
                  type: string
                  maxLength: 80
                deltaY:
                  description: Vertical pixels for scroll.
                  type: number
                  minimum: -100000
                  maximum: 100000
                code:
                  description: JavaScript expression for evaluate; executes only inside this browser page.
                  type: string
                  maxLength: 100000
                enabled:
                  description: Start or cancel native element picking for inspect without a ref.
                  type: boolean
                scope:
                  description: Screenshot area; selection requires a current inspected element.
                  type: string
                  enum:
                    - viewport
                    - fullpage
                    - selection
                format:
                  description: Screenshot format. Defaults to the saved inspector preference, or JPEG. PNG is lossless.
                  type: string
                  enum:
                    - jpeg
                    - png
                quality:
                  description: JPEG quality, 0–100. Defaults to the saved inspector preference, or 80. Ignored for PNG.
                  type: integer
                  minimum: 0
                  maximum: 100
                documentId:
                  description: Reject context requests if navigation has changed the document.
                  type: string
                  maxLength: 80
              required:
                - action
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserResult'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Use the browser artifact
      tags:
        - browser
  /api/threads:
    get:
      description: Lists the threads of one project folder, or of every project without `workspace`. Archived threads come with `archived=1`.
      operationId: Threads_list
      parameters:
        - name: workspace
          required: false
          in: query
          description: The project's folder; every project when absent.
          schema:
            description: The project's folder; every project when absent.
            type: string
        - name: archived
          required: false
          in: query
          description: '`1` or `true` lists the archived threads too.'
          schema:
            description: '`1` or `true` lists the archived threads too.'
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreadSummary'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: List threads
      tags:
        - threads
    post:
      description: Starts a thread in a project folder; with `local` the folder is switched to another branch first (only with a clean tree), with `worktree` it runs in a new git worktree of the project (a base, carried changes, a branch or none, a setup script).
      operationId: Threads_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThread'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '400':
          description: The folder is not an existing absolute path, or a worktree cannot be made from it (no git repository, no commits, no base branch), or a branch name is not one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: git could not create the worktree, or the folder cannot switch branch (uncommitted files, a branch a worktree holds, switching turned off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Create a thread
      tags:
        - threads
  /api/threads/events:
    get:
      description: "Keeps the connection open and sends newline-delimited JSON: a `snapshot` of every thread's state first, then a `state` line whenever one changes, `gone` for a deleted thread, `list` when threads or projects were added, removed, renamed or reordered, and a `ping` every 20 seconds."
      operationId: Threads_events
      parameters: []
      responses:
        '200':
          description: The stream stays open until the client closes it.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One `ThreadsEvent` per line.
                x-line-schema:
                  $ref: '#/components/schemas/ThreadsEvent'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Stream thread status
      tags:
        - threads
  /api/threads/{id}/placement:
    post:
      description: 'Applies the Where row to a thread that has no message yet: switches the folder to a branch, or makes a worktree and moves the thread into it.'
      operationId: Threads_place
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadPlacement'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '400':
          description: A branch name is not one, or a worktree cannot be made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The thread has begun, or the folder cannot switch branch, or git could not make the worktree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Place a new thread
      tags:
        - threads
  /api/threads/{id}:
    get:
      description: Returns one thread with the path of its session file.
      operationId: Threads_get
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get a thread
      tags:
        - threads
    patch:
      description: Renames, pins or archives a thread. Archiving can also remove the thread's worktree when it is clean.
      operationId: Threads_patch
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchThread'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Archiving cannot remove the worktree while it holds uncommitted changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Change a thread
      tags:
        - threads
    delete:
      description: Deletes the thread. Its worktree stays unless `worktree` says `remove` (409 while it holds uncommitted changes) or `force`.
      operationId: Threads_remove
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
        - name: worktree
          required: false
          in: query
          description: '`keep` (the default) leaves the worktree, `remove` removes it when it is clean (409 otherwise), `force` removes it whatever it holds.'
          schema:
            description: '`keep` (the default) leaves the worktree, `remove` removes it when it is clean (409 otherwise), `force` removes it whatever it holds.'
            type: string
            enum:
              - keep
              - remove
              - force
      responses:
        '204':
          description: The thread is deleted.
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A run holds the thread, or its worktree holds uncommitted changes and `worktree` is `remove`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Delete a thread
      tags:
        - threads
  /api/threads/{id}/seen:
    post:
      description: Clears the thread's unread dot and its "cli" badge.
      operationId: Threads_seen
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      responses:
        '204':
          description: The thread is marked as seen.
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Mark a thread as seen
      tags:
        - threads
  /api/threads/{id}/fork:
    post:
      description: Copies the thread into a new one, or only the path from the root to `entryId`, optionally in another folder.
      operationId: Threads_fork
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkThread'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The thread has no messages to fork yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Fork a thread
      tags:
        - threads
  /api/threads/{id}/clone:
    post:
      description: Copies the thread up to `entryId` (the whole thread without it) into a new thread.
      operationId: Threads_clone
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneThread'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread or entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The thread has no messages to clone yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Clone a thread
      tags:
        - threads
  /api/threads/{id}/feedback:
    get:
      description: Lists the thumbs up and down given to the assistant messages of the thread.
      operationId: Threads_listFeedback
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEntry'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: List message ratings
      tags:
        - threads
    put:
      description: "Sets, changes or (with `rating: null`) clears the rating of one message, and answers with the thread's ratings."
      operationId: Threads_putFeedback
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutFeedback'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackEntry'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Rate a message
      tags:
        - threads
  /api/workspaces/{id}/git:
    get:
      description: 'Returns the checked-out branch, the number of changed files, the local branches with the worktree that holds each, and the remote branches. `git: false` for a folder that is not a repository.'
      operationId: Workspaces_git
      parameters:
        - name: id
          required: true
          in: path
          description: The project's folder, URL-encoded (a project has no other id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGit'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The folder is not a known project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get a project's branches
      tags:
        - workspaces
  /api/workspaces/defaults:
    get:
      description: Returns where worktrees are made and where a new thread starts for every project that does not say otherwise.
      operationId: Workspaces_defaults
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeDefaults'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get the defaults for every project
      tags:
        - workspaces
    patch:
      description: Changes the worktree folder and the start mode that projects without their own setting use, and answers with the defaults.
      operationId: Workspaces_patchDefaults
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorktreeDefaults'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeDefaults'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Change the defaults for every project
      tags:
        - workspaces
  /api/workspaces:
    get:
      description: Lists the known project folders with their sidebar flags and thread counts.
      operationId: Workspaces_workspaces
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: List projects
      tags:
        - workspaces
    patch:
      description: Changes one project's sidebar flags (folded, hidden, the attendant's and the background agents' opt-outs) or its worktree settings, and answers with the projects.
      operationId: Workspaces_patchWorkspace
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkspace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The folder is not a known project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Change a project
      tags:
        - workspaces
    post:
      description: Adds a folder to the known projects.
      operationId: Workspaces_addWorkspace
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWorkspace'
      responses:
        '204':
          description: The folder is a known project.
        '400':
          description: The folder is not an existing absolute path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Open a project
      tags:
        - workspaces
  /api/workspaces/order:
    put:
      description: Sets the order of the sidebar's project groups, and answers with the projects.
      operationId: Workspaces_orderWorkspaces
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceOrder'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Reorder projects
      tags:
        - workspaces
  /api/workspaces/{id}:
    delete:
      description: Removes a project from the sidebar and the list of projects. Its threads, session files and folder are not touched, and its settings are kept for when the folder is opened again. Answers with the remaining projects.
      operationId: Workspaces_forgetWorkspace
      parameters:
        - name: id
          required: true
          in: path
          description: The project's folder, URL-encoded (a project has no other id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
