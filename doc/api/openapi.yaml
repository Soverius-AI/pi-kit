  /api/transcribe:
    post:
      description: Takes a recording as the request body and answers with its text. Nothing is stored. `words=1` adds the time and confidence of each word.
      operationId: Transcribe_recording
      parameters:
        - name: language
          required: false
          in: query
          schema:
            type: string
        - name: words
          required: false
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
      requestBody:
        required: true
        description: The recording itself as the request body (WAV, or WebM, Ogg or MP4 when ffmpeg is installed), not JSON or a form.
        content:
          audio/wav:
            schema:
              type: string
              format: binary
          audio/webm:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResult'
        '400':
          description: The recording could not be decoded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Whistle is not downloaded, or no speech engine could start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The recording is larger than 100 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Transcribe a recording
      tags:
        - transcribe
  /api/transcribe/stream:
    post:
      description: 'Takes a recording as the request body and streams server-sent events: `partial` with the newly committed words, then `done` with the whole result, or `error`.'
      operationId: Transcribe_stream
      parameters:
        - name: language
          required: false
          in: query
          schema:
            type: string
      requestBody:
        required: true
        description: The recording itself as the request body (WAV, or WebM, Ogg or MP4 when ffmpeg is installed), not JSON or a form.
        content:
          audio/wav:
            schema:
              type: string
              format: binary
          audio/webm:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The stream ends with `done` or `error`.
          content:
            text/event-stream:
              schema:
