    post:
      description: 'The person says what a hunk of the outcome is. The score is computed again from the labels as they stand; the correction is kept and shown to the model as an example the next time the thread is scored. `label: null` takes a correction back.'
      operationId: Score_relabel
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
