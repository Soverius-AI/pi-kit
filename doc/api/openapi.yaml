      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeScoreView'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread, it has not been scored, or the meat-proxy package is not installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get a thread's score
      tags:
        - score
    post:
      description: 'Labels every hunk of the thread’s outcome with the attendant’s model and computes the scores. While the attendant is off, the first request for a thread answers `consent` with the sentence to show and the model’s name; send it again with `consent: true` once the person agreed. Scoring again replaces the model’s labels and keeps the person’s corrections.'
      operationId: Score_request
      parameters:
        - name: id
          required: true
          in: path
          description: The thread id (the pi session id).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestScore'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreRequestResult'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There is no such thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'No score could be made: the package is not installed, the thread has no outcome, no model is available, the daily cap is reached, or the model’s answer did not label every requested hunk.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Score a thread now
      tags:
        - score
