              schema:
                $ref: '#/components/schemas/Problem'
      summary: Stop the llama-swap pi-kit started
      tags:
        - setup
  /api/setup/local-runtime/autostart:
    post:
      description: Saves whether pi-kit starts llama-swap with the selected config when it starts; answers with the local setup status.
      operationId: LocalRuntime_autostart
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalAutostart'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeStatus'
        '400':
          description: No llama-swap config is selected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Start llama-swap when pi-kit starts
      tags:
        - setup
  /api/setup/local-runtime/doctor:
    get:
      description: Reads the selected (or given) config and reports missing tools, invalid YAML, entries whose model file is gone and launchers that no longer exist, each marked fixable or not. Nothing is changed.
      operationId: LocalRuntime_doctor
      parameters:
        - name: path
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDoctor'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Check what keeps the selected llama-swap config from running
      tags:
        - setup
  /api/setup/local-runtime/repair:
    post:
      description: 'Applies the fixable findings of the doctor: removes entries whose model file is missing and points missing llama-server launchers at the installed one. Every other line of the YAML is kept; the version must match the doctor report.'
      operationId: LocalRuntime_repair
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRepair'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDoctor'
        '400':
          description: The YAML is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The config changed since it was checked, or a download is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Repair the selected llama-swap config
      tags:
        - setup
  /api/setup/local-runtime/install:
    post:
      description: Starts an explicit cancellable Homebrew job for llama.cpp and/or the official llama-swap tap; reuses already installed tools.
      operationId: LocalRuntime_install
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalInstall'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeJob'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local setup job is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Install selected local inference tools
      tags:
        - setup
  /api/setup/local-runtime/download:
    post:
      description: Requires explicit acceptance, a catalogue selection and enough disk space. Verifies pinned size/SHA-256 and atomically publishes the model; failures clean up partial files.
      operationId: LocalRuntime_download
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalDownload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeJob'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local setup job is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Download a selected GGUF model
      tags:
        - setup
  /api/setup/local-runtime/retry:
    post:
      description: Uses the saved exact file and immutable revision, or the saved setup choices. Works after an app restart.
      operationId: LocalRuntime_retry
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeJob'
        '400':
          description: The job has no saved retry details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local action is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Retry the last interrupted local-model action
      tags:
        - setup
  /api/setup/local-runtime/dismiss:
    post:
      description: Clears the finished status card without deleting model files.
      operationId: LocalRuntime_dismiss
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeStatus'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The job is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Dismiss a finished local-model job
      tags:
        - setup
  /api/setup/local-runtime/storage:
    get:
      description: Reports actual free space and owned incomplete downloads or corrupt backups.
      operationId: LocalRuntime_storage
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalStorage'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Inspect local-model disk usage
      tags:
        - setup
  /api/setup/local-runtime/register:
    post:
      description: Adds the file to the selected existing llama-swap config while preserving its other entries and options. Does not start a server or run inference.
      operationId: LocalRuntime_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRegister'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeStatus'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local action is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Add an installed model to llama-swap
      tags:
        - setup
  /api/setup/local-runtime/models/remove:
    post:
      description: Requires confirmation and a previously discovered model ID. Removes tracked config entries for this file and deletes it, preserving unrelated models and the existing llama-swap service.
      operationId: LocalRuntime_removeModel
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRemoveModel'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalStorageChange'
        '400':
          description: The model is no longer present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local action is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Delete an installed local-model file
      tags:
        - setup
  /api/setup/local-runtime/storage/remove:
    post:
      description: Deletes only an owned file from the storage inventory, identified by its opaque ID.
      operationId: LocalRuntime_removeFile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRemoveFile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalStorageChange'
        '400':
          description: The file is no longer present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local action is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Delete an incomplete or corrupt model file
      tags:
        - setup
  /api/setup/local-runtime/cleanup:
    post:
      description: Reclaims owned interrupted partial files while keeping completed models and corrupt backups. The active job must finish cleanup first.
      operationId: LocalRuntime_cleanup
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalStorageChange'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another local action is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Remove incomplete model downloads
      tags:
        - setup
  /api/setup/local-runtime/cancel:
    post:
      description: Cancels the active job and waits for cleanup before a retry can start. Existing external model servers are unaffected.
      operationId: LocalRuntime_cancel
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeStatus'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Cancel local setup
      tags:
        - setup
  /api/providers/{id}/usage:
    get:
      description: Returns how much of a subscription window is used or how much credit is left, where the provider offers it (Anthropic subscriptions, OpenRouter, Radius), and `null` where it does not. Cached for one minute unless refresh is enabled; concurrent reads share one request. The credential is never part of the answer.
      operationId: Usage_get
      parameters:
        - name: id
          required: true
          in: path
          description: The provider's id, as `GET /api/pi-settings` lists it.
          schema:
            type: string
        - name: refresh
          required: false
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
              - 'true'
              - 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProviderUsage'
                  - type: 'null'
        '400':
          description: 'The request is not valid. `message` lists each problem as `path: reason`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Get a provider's usage
      tags:
        - pi-settings
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    About:
      type: object
      properties:
        app:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            desktop:
              type: boolean
          required:
            - name
            - version
            - desktop
          additionalProperties: false
        pi:
          type: object
          properties:
            version:
              type: string
            packageName:
              type: string
            packageDir:
              type: string
            source:
              default: bundled
              type: string
              enum:
                - env
                - managed
                - bundled
            range:
              type: object
              properties:
                min:
                  type: string
                max:
                  type: string
              required:
                - min
                - max
              additionalProperties: false
            notes:
              default: []
              type: array
              items:
                type: string
          required:
            - version
            - packageName
            - packageDir
            - source
            - notes
          additionalProperties: false
        node:
          type: string
      required:
        - app
        - pi
        - node
      additionalProperties: false
    AgentAnswer:
      type: object
      properties:
        question:
          type: string
        text:
          type:
            - string
            - 'null'
        by:
          type: string
          enum:
            - main
            - user
            - default
            - cancelled
            - expired
        answeredAt:
          type: number
      required:
        - question
        - text
        - by
        - answeredAt
      additionalProperties: false
    AgentAnswerBody:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        text:
          type: string
        cancelled:
          type: boolean
      required:
        - question
    AgentMessageBody:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        mode:
          default: followUp
          type: string
          enum:
            - steer
            - followUp
      required:
        - text
    AgentQuestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        kind:
          type: string
          enum:
            - main
            - user
        choices:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        note:
          type:
            - string
            - 'null'
        forwarded:
          type: boolean
        askedAt:
          type: number
        expiresAt:
          type:
            - number
            - 'null'
      required:
        - id
        - text
        - kind
        - choices
        - note
        - forwarded
        - askedAt
        - expiresAt
      additionalProperties: false
    AgentTokens:
      type: object
      properties:
        input:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        output:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        cacheRead:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        cacheWrite:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - input
        - output
        - cacheRead
        - cacheWrite
      additionalProperties: false
    ApprovedSkillDraft:
      type: object
      properties:
        draft:
          $ref: '#/components/schemas/SkillDraft'
        path:
          type: string
      required:
        - draft
        - path
      additionalProperties: false
    ApproveSkillDraft:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope:
          type: string
          enum:
            - project
            - user
        text:
          type: string
          minLength: 1
          maxLength: 200000
        verify:
          type: boolean
      required:
        - name
        - scope
        - text
      additionalProperties: false
    AppSettings:
      type: object
      propertyNames:
        type: string
      additionalProperties: {}
    AttendantAction:
      type: object
      properties:
        id:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        at:
          type: number
        kind:
          type: string
          enum:
            - title
            - summary
            - label
            - draft
            - learn
            - score
            - prompt
        status:
          type: string
          enum:
            - done
            - skipped
            - error
        threadId:
          type:
            - string
            - 'null'
        threadTitle:
          type:
            - string
            - 'null'
        text:
          type: string
        model:
          type:
            - string
            - 'null'
        inputTokens:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        outputTokens:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        cost:
          type: number
          minimum: 0
      required:
        - id
        - at
        - kind
        - status
        - threadId
        - threadTitle
        - text
        - model
        - inputTokens
        - outputTokens
        - cost
      additionalProperties: false
    AttendantRun:
      type: object
      properties:
        threadId:
          type: string
          minLength: 1
      additionalProperties: false
    AttendantRunResult:
      type: object
      properties:
        queued:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - queued
      additionalProperties: false
    AttendantSettings:
      type: object
      properties:
        enabled:
          type: boolean
        followUpSuggestions:
          default: false
          type: boolean
        model:
          anyOf:
            - type: object
              properties:
                provider:
                  type: string
                  minLength: 1
                modelId:
                  type: string
                  minLength: 1
              required:
                - provider
                - modelId
              additionalProperties: false
            - type: 'null'
        when:
          $ref: '#/components/schemas/AttendantWhen'
        dailyCostCap:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
      required:
        - enabled
        - followUpSuggestions
        - model
        - when
        - dailyCostCap
      additionalProperties: false
    AttendantStatus:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/AttendantSettings'
        calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        today:
          $ref: '#/components/schemas/AttendantUsage'
        capReached:
          type: boolean
        queued:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        activeModel:
          type:
            - string
            - 'null'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AttendantAction'
      required:
        - settings
        - calls
        - today
        - capReached
        - queued
        - activeModel
        - actions
      additionalProperties: false
    AttendantUsage:
      type: object
      properties:
        cost:
          type: number
          minimum: 0
        calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        inputTokens:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        outputTokens:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - cost
        - calls
        - inputTokens
        - outputTokens
      additionalProperties: false
    AttendantWhen:
      type: object
      properties:
        onEnd:
          type: boolean
        onInterrupt:
          type: boolean
        everyMinutes:
          type: integer
          minimum: 0
          maximum: 1440
      required:
        - onEnd
        - onInterrupt
        - everyMinutes
      additionalProperties: false
    BashRequest:
      type: object
      properties:
        command:
          type: string
          minLength: 1
        excludeFromContext:
          type: boolean
      required:
        - command
      additionalProperties: false
    BgAgent:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        name:
          type: string
        role:
          type: string
        model:
          type:
            - string
            - 'null'
        permission:
          type: string
          enum:
            - read-only
            - edit
            - isolated
        brief:
          type: string
        status:
          type: string
          enum:
            - active
            - blocked
            - done
            - failed
            - stopped
        blocked:
          anyOf:
            - type: string
              enum:
                - cleanup
                - crash-loop
            - type: 'null'
        createdAt:
          type: number
        finishedAt:
          type:
            - number
            - 'null'
        cost:
          type: number
        tokens:
          $ref: '#/components/schemas/AgentTokens'
        report:
          type:
            - string
            - 'null'
        activity:
          type: string
          enum:
            - idle
            - running
            - tool
        tool:
          type:
            - string
            - 'null'
        context:
          anyOf:
            - type: object
              properties:
                tokens:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                window:
                  anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
              required:
                - tokens
                - window
              additionalProperties: false
            - type: 'null'
        question:
          anyOf:
            - $ref: '#/components/schemas/AgentQuestion'
            - type: 'null'
        answered:
          anyOf:
            - $ref: '#/components/schemas/AgentAnswer'
            - type: 'null'
        turns:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        worktree:
          type:
            - string
            - 'null'
      required:
        - id
        - threadId
        - name
        - role
        - model
        - permission
        - brief
        - status
        - blocked
        - createdAt
        - finishedAt
        - cost
        - tokens
        - report
        - activity
        - tool
        - context
        - question
        - answered
        - turns
        - worktree
      additionalProperties: false
    BrowserInspection:
      type: object
      properties:
        ref:
          type: string
          maxLength: 80
        documentId:
          type: string
          maxLength: 80
        selector:
          type: string
          maxLength: 1000
        tag:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 500
        role:
          type: string
          maxLength: 80
        bounds:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
          required:
            - x
            - y
            - width
            - height
          additionalProperties: false
        styles:
          type: object
          propertyNames:
            type: string
            maxLength: 80
          additionalProperties:
            type: string
            maxLength: 200
      required:
        - ref
        - documentId
        - selector
        - tag
        - name
        - role
        - bounds
        - styles
      additionalProperties: false
    BrowserResult:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/BrowserState'
        text:
          type: string
        screenshot:
          type: object
          properties:
            data:
              type: string
            mimeType:
              type: string
              enum:
                - image/png
                - image/jpeg
          required:
            - data
            - mimeType
          additionalProperties: false
        logs:
          maxItems: 100
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              documentId:
                type: string
