<title>Rooms and Threads Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: pi-kit shell (sidebar 280 · transcript · side panel 400 · status 28), pi-light / pi-dark tokens from doc/docs/design-system.md */
  :root {
    --b100: #ffffff;
    --b200: #f2f3f5;
    --b300: #e1e3e8;
    --fg: #1d2026;
    --muted: #6b707a;
    --sunken: #1d2026;
    --primary: #8e6512;
    --on-primary: #ffffff;
    --info: #2e63b8;
    --success: #2f7d4b;
    --warning: #a3610d;
    --error: #b5362e;
    --shadow: 0 8px 24px rgb(20 24 32 / 0.12);
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --b100: #1f1f1f;
      --b200: #141414;
      --b300: #3f3f3f;
      --fg: #ededed;
      --muted: #a3a3a3;
      --sunken: #0f0f0f;
      --primary: #e9b44c;
      --on-primary: #1a1408;
      --info: #4daafc;
      --success: #73c991;
      --warning: #e2a93b;
      --error: #f85149;
      --shadow: 0 12px 32px rgb(0 0 0 / 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --b100: #1f1f1f;
    --b200: #141414;
    --b300: #3f3f3f;
    --fg: #ededed;
    --muted: #a3a3a3;
    --sunken: #0f0f0f;
    --primary: #e9b44c;
    --on-primary: #1a1408;
    --info: #4daafc;
    --success: #73c991;
    --warning: #e2a93b;
    --error: #f85149;
    --shadow: 0 12px 32px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--b200);
    color: var(--fg);
    font: 14px/22px var(--sans);
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }
  .ic {
    width: 16px;
    height: 16px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ic.s14 {
    width: 14px;
    height: 14px;
  }
  .mono {
    font-family: var(--mono);
  }
  .muted {
    color: var(--muted);
  }
  .xs {
    font-size: 12px;
    line-height: 16px;
  }
  .sm {
    font-size: 13px;
    line-height: 18px;
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .sim {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
    background: color-mix(in srgb, var(--info) 12%, var(--b100));
    border-bottom: 1px solid var(--b300);
    font-size: 12px;
    line-height: 16px;
  }
  .sim b {
    font-weight: 600;
  }
  .sim .tours {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .sim .tours button {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--b100);
    border: 1px solid var(--b300);
  }
  .sim .tours button:hover {
    border-color: var(--info);
  }

  .shell {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr) 28px;
  }

  /* Sidebar */
  .side {
    grid-row: 1;
    width: 280px;
    display: flex;
    flex-direction: column;
    background: var(--b100);
    border-right: 1px solid var(--b300);
    min-height: 0;
  }
  .side.rail {
    width: 48px;
  }
  .side-top {
    height: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    flex: none;
  }
  .side-top .grow {
    flex: 1;
  }
  .search {
    flex: 1;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 2px 0 10px;
    border-radius: 8px;
    background: var(--b200);
    color: var(--muted);
    font-size: 13px;
    min-width: 0;
    box-shadow: inset 0 0 0 1px var(--b300);
  }
  .search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    background: none;
    color: var(--fg);
    font: inherit;
    outline: none;
  }
  .search:focus-within {
    box-shadow: inset 0 0 0 1px var(--primary);
  }
  .sq.sm {
    width: 28px;
    height: 28px;
  }
  .side-top .sq {
    position: relative;
  }
  .side-top .sq:hover,
  .side-top .sq.on {
    color: var(--fg);
    background: var(--b200);
  }
  .fdot {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
  }
  .new {
    height: 32px;
    display: flex;
    align-items: center;
    border-radius: 999px;
    background: var(--primary);
    color: var(--on-primary);
  }
  .new button {
    height: 32px;
    padding: 0 8px;
    display: grid;
    place-items: center;
  }
  .new button + button {
    border-left: 1px solid color-mix(in srgb, var(--on-primary) 30%, transparent);
  }
  .quick {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px 8px;
    flex: none;
  }
  .quick .proj {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
  }
  .quick .tile {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--b300);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 600;
  }
  .quick .br {
    font: 11px var(--mono);
    color: var(--muted);
  }
  .quick .qb {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    color: var(--muted);
  }
  .quick .qb:hover {
    background: var(--b200);
    color: var(--fg);
  }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .needs {
    border-radius: 10px;
    background: color-mix(in srgb, var(--warning) 9%, var(--b100));
    padding: 0 4px 4px;
  }
  .needs header {
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    color: var(--warning);
    font-size: 12px;
    font-weight: 500;
  }
  .needs header .n {
    margin-left: auto;
    color: var(--muted);
    font-weight: 400;
  }
  .needs button {
    width: 100%;
    text-align: left;
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    gap: 2px 8px;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .needs button:hover {
    background: color-mix(in srgb, var(--warning) 12%, var(--b100));
  }
  .needs .t {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .needs .q {
    grid-column: 2;
    font-size: 12px;
    line-height: 16px;
    color: var(--muted);
  }
  .grp-h {
    height: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .grp-h .ic {
    color: var(--muted);
  }
  .grp-h .act {
    margin-left: auto;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: grid;
    place-items: center;
  }
  .grp-h .act:hover {
    background: var(--b200);
    color: var(--fg);
  }
  .row {
    width: 100%;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 13px;
    text-align: left;
  }
  .row:hover {
    background: var(--b200);
  }
  .row[aria-current='true'] {
    background: var(--b300);
  }
  .row .nm {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.thread {
    padding-left: 24px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }
  .dot.run {
    background: var(--primary);
  }
  .dot.wait {
    background: var(--warning);
  }
  .unread {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .room-ic {
    color: var(--info);
  }
  .addp {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .side-foot {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-top: 1px solid var(--b300);
    font-size: 12px;
    color: var(--muted);
    flex: none;
  }
  .side-foot .ok {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }
  .side-foot .gb {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 6px;
  }
  .side-foot .gb:hover {
    background: var(--b200);
    color: var(--fg);
  }
  .rail-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    flex: 1;
  }
  .rtile {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    background: var(--b200);
  }
  .rtile[aria-current='true'] {
    background: var(--b300);
  }
  .rtile .dot {
    position: absolute;
    top: -2px;
    right: -2px;
    border: 2px solid var(--b100);
    width: 12px;
    height: 12px;
  }
  .rsep {
    width: 24px;
    height: 1px;
    background: var(--b300);
  }
  .mseg {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: 999px;
    background: var(--b200);
    box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.18);
    flex: none;
  }
  .mseg.vert {
    flex-direction: column;
  }
  .mseg button {
    position: relative;
    width: 32px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .mseg button:hover {
    color: var(--fg);
  }
  .mseg button[aria-selected='true'] {
    background: var(--b100);
    color: var(--fg);
    box-shadow:
      0 0 0 1px var(--b300),
      0 1px 2px rgb(0 0 0 / 0.2);
  }
  .mbadge {
    position: absolute;
    top: 3px;
    right: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--b200);
  }
  .mbadge.wait {
    background: var(--warning);
  }
  .mbadge.unread {
    background: var(--info);
  }
  .new.solo {
    width: 32px;
    justify-content: center;
  }
  .rlist {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rrow {
    width: 100%;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px;
    border-radius: 8px;
    text-align: left;
  }
  .rrow:hover {
    background: var(--b200);
  }
  .rrow[aria-current='true'] {
    background: var(--b300);
  }
  .rbadge {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    flex: none;
    background: color-mix(in srgb, var(--info) 14%, transparent);
    color: var(--info);
  }
  .rmain {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .rt {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
  }
  .rt .nm {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rs {
    font-size: 11px;
    line-height: 15px;
    color: var(--muted);
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .ag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--mono);
    font-size: 10px;
    padding: 0 5px 0 1px;
    border-radius: 999px;
    border: 1px solid var(--b300);
    color: var(--fg);
  }
  .ag.off {
    color: var(--muted);
    border-style: dashed;
  }
  .env-strip {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-top: 1px solid var(--b300);
    font-size: 13px;
    flex: none;
  }
  .env-strip.muted {
    font-size: 12px;
  }
  .env-strip .nm {
    font-weight: 500;
  }
  .env-strip .ic:last-child {
    margin-left: auto;
  }
  .envdot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }

  /* Main */
  .main {
    grid-row: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    container-type: inline-size;
    container-name: chat-header;
  }
  .hdr {
    height: 48px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    border-bottom: 1px solid var(--b300);
    background: var(--b100);
  }
  .sq {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--muted);
    flex: none;
  }
  .sq:hover {
    background: var(--b200);
    color: var(--fg);
  }
  .tag {
    height: 16px;
    padding: 0 7px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 16px;
    font-weight: 500;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .tag.room {
    background: color-mix(in srgb, var(--info) 16%, transparent);
    color: var(--info);
  }
  .tag.thread {
    background: var(--b200);
    color: var(--muted);
    border: 1px solid var(--b300);
  }
  .tag.sim-t {
    background: color-mix(in srgb, var(--info) 12%, transparent);
    color: var(--info);
  }
  .hdr h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .hdr .meta {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .hdr .acts {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: 999px;
    background: var(--b200);
  }
  .seg button {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .seg button:hover:not(:disabled) {
    color: var(--fg);
    background: var(--b300);
  }
  .seg button[aria-pressed='true'] {
    background: var(--b100);
    color: var(--primary);
    box-shadow: 0 0 0 1px var(--b300);
  }
  .pocket {
    display: none;
  }
  .hmenu-wrap {
    position: relative;
  }
  @container chat-header (max-width: 720px) {
    .hdr .meta {
      display: none;
    }
    .seg {
      display: none;
    }
    .pocket {
      display: grid;
    }
  }

  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .transcript > * {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .by {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    line-height: 16px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .by b {
    color: var(--fg);
    font-weight: 500;
    font-size: 13px;
  }
  .by .k {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .envchip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font: 11px/16px var(--mono);
    padding: 0 6px;
    border-radius: 999px;
    background: var(--b200);
    border: 1px solid var(--b300);
    color: var(--fg);
    white-space: nowrap;
  }
  .envchip.plain {
    padding-left: 6px;
  }
  .edot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .edot.off {
    background: var(--error);
  }
  .txt {
    font-size: 15px;
    line-height: 24px;
  }
  .msg.me .bub {
    align-self: flex-end;
    max-width: 85%;
    background: var(--b100);
    border: 1px solid var(--b300);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .msg.me .by {
    justify-content: flex-end;
  }
  .provenance {
    border-left: 2px solid var(--b300);
    padding: 4px 0 4px 12px;
    font-size: 13px;
    line-height: 20px;
    color: var(--muted);
  }
  .ev {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    font-size: 13px;
    line-height: 18px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--b100);
    border: 1px solid var(--b300);
  }
  .ev .lead-ic {
    color: var(--muted);
  }
  .ev .ok {
    color: var(--success);
  }
  .ev .w {
    color: var(--warning);
  }
  .ev .grow {
    flex: 1;
    min-width: 0;
  }
  .ev .loc {
    font: 11px var(--mono);
    color: var(--muted);
  }
  .link {
    color: var(--info);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .link:hover {
    text-decoration: underline;
  }
  .qcard {
    border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--b300));
    background: color-mix(in srgb, var(--warning) 7%, var(--b100));
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .qcard .qh {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--warning);
    font-weight: 500;
  }
  .qcard .opts {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--b300);
    background: var(--b100);
  }
  .btn:hover:not(:disabled) {
    background: var(--b200);
  }
  .btn.pri {
    background: var(--primary);

        return `<div class="qcard" id="prop" role="group" aria-label="Task proposal"><div class="qh">${ic('agents', 's14')}Lead · ${envChip('Server')} proposes a task</div><div class="txt" style="font-size:14px"><b>${esc(m.title)}</b></div><div class="xs muted">Runs on ${envChip(m.env, { status: true })} · base <span class="mono">${m.base}</span> · done when: ${esc(m.criteria)}</div>${m.done ? `<div class="xs muted">${ic('check', 's14')} ${esc(m.done)}</div>` : `<div class="opts"><button class="btn sm pri" data-act="approve">Approve</button><button class="btn sm" data-act="decline">Decline</button></div>`}</div>`;
      if (m.k === 'prov') return `<div class="provenance">${ic('lock', 's14')} ${esc(m.text)}</div>`;
      if (m.k === 'tool') return `<div class="ev"><span class="mono xs muted">${esc(m.text)}</span></div>`;
      if (m.k === 'thinking')
        return `<div class="msg"><div class="by"><b>${m.who}</b><span class="k">${ic('agents', 's14')}agent</span>${envChip(m.env)}</div><div class="thinking">Working…</div></div>`;
      if (m.k === 'note') return `<div class="notice">${ic('alert', 's14')}${m.text}</div>`;
      if (m.k === 'ev')
        return `<div class="ev">${ic(m.icon, m.cls)}<span class="grow">${m.text} <span class="loc">${esc(m.loc)}</span></span>${m.act ? `<button class="link" data-task="${m.task}">${m.act}</button>` : ''}</div>`;
      if (m.k === 'q')
        return `<div class="qcard" id="qcard" role="group" aria-label="Question from ${m.who} on ${m.env}"><div class="qh">${ic('question', 's14')}${m.who} · agent · ${envChip(m.env)} asks</div><div class="txt" style="font-size:14px">${esc(m.text)}</div>
      ${m.answered ? `<div class="xs muted">${ic('check', 's14')} You answered “${esc(m.answered)}”. Only ${m.who} was prompted.</div>` : `<div class="opts">${m.opts.map((o) => `<button class="btn sm" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}</div>`;
      if (m.k === 'result') {
        const done = m.state.startsWith('Integrated');
        return `<div class="result" id="result"><div class="rh">${ic('merge', 's14')}Result · ${esc(m.title)}<span class="state ${done ? 'ok' : 'warn'}">${esc(m.state)}</span></div>
      <div class="xs muted">${m.who} · ${envChip(m.env)} · base <span class="mono">${m.base}</span> → head <span class="mono">${m.head}</span> · ${m.tests}</div>
      <div class="paths">${esc(m.paths).replace(/\n/g, '<br>')}</div>
      ${
        done
          ? ''
          : `<div class="opts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="review">Review</button><button class="btn sm pri" data-act="integrate" data-res="${m.task}">Integrate</button></div>
      <div class="xs muted">Tests passed on ${m.env}. Nothing lands until you integrate it.</div>`
      }</div>`;
      }
      const who = m.me ? '' : `<span class="k">${ic('agents', 's14')}agent</span>${envChip(m.env)}`;
      return `<div class="msg ${m.me ? 'me' : ''}"><div class="by"><b>${m.who}</b>${who}${m.routed ? `<span>→ prompted ${m.routed}</span>` : ''}</div><div class="${m.me ? 'bub' : ''} txt">${esc(m.text)}</div></div>`;
    }

    function composer() {
      if (!isRoom()) {
        return `<div class="composer"><div class="well">
        <div class="field"><textarea id="draft" rows="2" placeholder="Message your assistant…" aria-label="Message your assistant">${esc(S.draft)}</textarea></div>
        <div class="ctl-row"><button class="chip" aria-label="Attach">${ic('plus', 's14')}</button><button class="chip">Opus 5.5 ${ic('chev', 's14')}</button><button class="chip">${ic('lock', 's14')}Ask before edits ${ic('chev', 's14')}</button><button class="send" data-act="send" aria-label="Send">${ic('up', 's14')}</button></div>
      </div></div>`;
      }
      const a = target();
      const offline = a && !a.online;
      const busy = a && a.online && a.busy;
      const label = a ? `Route: ${a.name}` : 'Route: just post';
      const hint = a ? `Prompts <b>${a.name} · ${a.env}</b>.` : 'Posts without prompting any agent.';
      return `<div class="composer"><div class="well">
      <div class="ctl-row">
        <button class="chip ${offline ? 'warn' : ''}" data-act="route" aria-haspopup="menu" aria-expanded="${S.menu === 'route'}" aria-label="${label}. Change route">${ic('agents', 's14')}${label}${ic('chev', 's14')}</button>
        ${busy ? `<button class="chip" data-act="deliver" title="The routed agent is working">Deliver: ${S.deliver === 'steer' ? 'Steer' : 'Follow-up'} ${ic('chev', 's14')}</button>` : ''}
      </div>
      ${S.menu === 'route' ? routeMenu() : ''}
      <div class="field"><textarea id="draft" rows="2" placeholder="Message the room…" aria-label="${label}. Message the room">${esc(S.draft)}</textarea></div>
      ${offline ? `<div class="confirm-line">${ic('wifi', 's14')}<span style="flex:1;min-width:180px">${a.name} · ${a.env} is offline. Your message is posted and delivered when it reconnects.</span><button class="btn sm" data-act="to-lead">Route to Lead instead</button></div>` : ''}
      <div class="ctl-row"><button class="chip" aria-label="Attach">${ic('plus', 's14')}</button>
        ${offline ? `<button class="send wide" data-act="send">${ic('send', 's14')}Post and queue</button>` : !a ? `<button class="send wide" data-act="send">${ic('send', 's14')}Post</button>` : `<button class="send" data-act="send" aria-label="Send">${ic('up', 's14')}</button>`}</div>
      <div class="hint" aria-live="polite">${hint}</div>
    </div></div>`;
    }
    const routeMenu = () => `<div class="menu" role="menu" aria-label="Route" style="left:8px;top:40px">
    ${roomAgents()
      .map(
        (a) =>
          `<button class="mi" role="menuitemradio" aria-checked="${S.route === a.id}" data-route="${a.id}">${ic('agents', 'room-ic')}<span class="grow">${a.name}${a.id === 'lead' ? ' (default)' : ''}<span class="sub">${a.env} · ${a.online ? (a.busy ? 'busy' : 'idle') : 'offline'}</span></span>${S.route === a.id ? ic('check', 's14') : ''}</button>`,
      )
      .join('')}
    <div class="sep"></div>
    <button class="mi" role="menuitemradio" aria-checked="${S.route === 'none'}" data-route="none">${ic('send')}<span class="grow">Just post (no agent)<span class="sub">A note or decision; nobody is prompted</span></span>${S.route === 'none' ? ic('check', 's14') : ''}</button></div>`;

    function taskCard(t) {
      const a = agents[t.agent];
      const pres = t.presence === 'online' ? ['Online', 'ok'] : ['Last seen ' + t.lastSeen, 'warn'];
      const ts = {
        running: ['Running · ' + t.mins + 'm', 'run'],
        'stop-req': ['Stop requested…', 'warn'],
        stopped: ['Stopped', ''],
        submitted: ['Submitted', 'ok'],
        done: ['Done', 'ok'],
      }[t.task];
      const ring = `<svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--b300)" stroke-width="2.4"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-dasharray="${(t.ring / 100) * 50.3} 50.3" transform="rotate(-90 10 10)"/></svg>`;
      return `<article class="card" id="card-${t.id}" aria-label="Task ${esc(t.title)}, ${a.name} on ${a.env}">
      <div class="ch">${ic('agents', 'room-ic')}<span class="nm">${esc(t.title)}<span class="role">${a.name} · ${a.env}</span></span>${t.task === 'running' ? ring : ''}</div>
      <div class="exec">${envChip(a.env, { status: true })} ${t.branch} · base ${t.base}</div>
      <div class="tri"><div><div class="l">Presence</div><div class="v ${pres[1]}">${pres[0]}</div></div><div><div class="l">Task</div><div class="v ${ts[1]}">${t.presence === 'unreachable' && t.task === 'running' ? 'Running (last known)' : ts[0]}</div></div><div><div class="l">Integration</div><div class="v ${t.integ.startsWith('Submitted') ? 'warn' : t.integ.startsWith('Integrated') ? 'ok' : ''}">${t.integ}</div></div></div>
      ${t.presence === 'unreachable' ? `<div class="caveat">${ic('wifi', 's14')}<span>Last seen ${t.lastSeen}. The task may still be running.${t.task === 'stop-req' ? ' Stop not confirmed: ' + a.env + ' is unreachable.' : ''}</span></div>` : ''}
      <div class="nums">⏱ ${t.mins}m · ${t.turns} turns · ${t.cost}
        <span class="acts">
          <button class="ib" data-session="${t.id}" title="Open work session" aria-label="Open work session of ${esc(t.title)}">${ic('eye', 's14')}</button>
          ${t.task === 'running' ? `<button class="ib" data-stop="${t.id}" title="Stop ${a.name}" aria-label="Stop ${a.name}">${ic('stop', 's14')}</button>` : ''}
          ${t.task === 'submitted' ? `<button class="btn sm pri" data-act="integrate" data-res="${t.id}">Integrate</button>` : ''}
        </span></div></article>`;
    }

    function panel() {
      if (!S.panel) return '';
      const close = `<button class="sq" data-act="pclose" aria-label="Close panel">${ic('close')}</button>`;
      if (!isRoom()) {
        const map = {
          tree: 'Session tree',
          files: 'Files',
          changes: 'Changes',
          terminal: 'Terminal',
          agents: 'Agents',
          artifacts: 'Artifacts',
        };
        const { p } = threadInfo();
        return `<aside class="panel" aria-label="${map[S.panel]}"><div class="pbar"><h2>${map[S.panel]}</h2><span class="xs muted">${p.name}</span>${envChip(p.env)}${close}</div>
        <div class="pbody"><div class="empty"><h3>${map[S.panel]} for this thread</h3>Unchanged from today. The thread owns one workspace: ${p.name} on ${p.env}.</div></div></aside>`;
      }
      const agentRows = roomAgents()
        .map(
          (a) =>
            `<div class="mrow">${ic('agents', 'room-ic')}<span class="grow">${a.name}<span class="sub">${a.env} · ${a.role}</span></span><span class="state ${a.online ? 'ok' : 'warn'}">${a.online ? 'online' : 'last seen 3m ago'}</span></div>`,
        )
        .join('');
      const addEnv = `<button class="btn sm" data-act="addenv" style="align-self:flex-start">${ic('plus', 's14')}Add environment…</button>`;
      if (selId() !== 'xm')
        return `<aside class="panel" aria-label="Work"><div class="pbar"><h2>Work</h2>${close}</div><div class="pbody"><div class="psec">Agents</div>${agentRows}${addEnv}<div class="empty"><h3>No tasks yet</h3>When Lead proposes a task and you approve it, it appears here with where it runs.</div></div></aside>`;
      const groups = [
        ['Needs you', S.tasks.filter((t) => t.task === 'submitted')],
        ['Running', S.tasks.filter((t) => t.task === 'running' || t.task === 'stop-req')],
        ['Done', S.tasks.filter((t) => t.task === 'done' || t.task === 'stopped')],
      ];
      return `<aside class="panel" aria-label="Work"><div class="pbar"><h2>Work</h2><span class="xs muted">${S.tasks.length} tasks</span>${close}</div>
      <div class="pbody"><div class="psec">Agents</div>${agentRows}${addEnv}
      ${groups
        .filter((g) => g[1].length)
        .map((g) => `<div class="psec">${g[0]} · ${g[1].length}</div>${g[1].map(taskCard).join('')}`)
        .join('')}</div></aside>`;
    }

    function status() {
      if (isRoom()) return `<footer class="status"><span>Room host ${room().host} · connected</span></footer>`;
      const { p } = threadInfo();
      return `<footer class="status"><span>${p.name} · ${p.env}</span><span>idle</span><span>12.4k tokens · $0.04</span><span class="r">Backend ready</span></footer>`;
    }

    function dialog() {
      if (!S.dialog) return '';
      const d = S.dialog;
      if (d.type === 'start') {
        const runs = Object.keys(d.runs).filter((k) => d.runs[k]);
        const ok = d.name.trim() && runs.length;
        const envOpt = (n) => {
          const off = !envs[n].online;
          return `<label class="radio ${off ? 'dis' : ''}" ${off ? 'style="opacity:.55;cursor:not-allowed"' : ''}><input type="checkbox" data-runs="${n}" ${d.runs[n] ? 'checked' : ''} ${off ? 'disabled' : ''}><span class="grow">${n}<span class="sub" style="font-family:var(--sans)">${off ? 'offline, can’t be asked now' : n === 'Server' ? 'paired · always on · pi-kit ready' : 'paired · online · pi-kit ready'}</span></span></label>`;
        };
        return `<div class="scrim" data-act="dclose-scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="sr-t">
        <header><h2 id="sr-t">Start a room from this thread</h2><p>Only the summary below is shared. The thread itself stays private.</p></header>
        <div class="db">
          <section class="step"><h3>Name and base</h3>
            <input class="inp" id="sr-name" value="${esc(d.name)}" aria-label="Room name">
            <div class="kv"><span class="k">Repository</span><span class="mono sm">github.com/Soverius-AI/pi-kit · main</span><span class="k">Base commit</span><span class="mono sm">a1b2c3d (HEAD)</span></div>
            <div class="warnbox">${ic('alert', 's14')}<span>2 uncommitted files will not be shared. Commit first, or continue with HEAD.</span></div></section>
          <section class="step"><h3>Host</h3>
            <div class="choice">${[
              ['Server', 'Always on · recommended'],
              ['This Mac', 'The room stops while this Mac sleeps'],
            ]
              .map(
                ([n, s]) =>
                  `<label class="radio"><input type="radio" name="srhost" value="${n}" ${d.host === n ? 'checked' : ''}><span class="grow">${n}<span class="sub" style="font-family:var(--sans)">${s}</span></span></label>`,
              )
              .join('')}</div>
            <div class="xs muted">The lead is a new session on the host that only sees the summary.</div></section>
          <section class="step"><h3>Runs tasks</h3>
            <div class="choice">${['Server', 'Laptop', 'Desktop'].map(envOpt).join('')}</div>
            <div class="xs muted">You approve every task before it runs.</div></section>
          <section class="step"><h3>Summary</h3>
            <textarea class="inp" id="sr-sumtext" aria-label="Summary to share" placeholder="What should the lead and workers know?">${esc(d.summaryText)}</textarea>
            <button class="btn sm" data-act="draftsum" style="align-self:flex-start">Draft from thread</button>
            <div class="preview" aria-label="What the agents will see"><span class="xs muted">${ic('eye', 's14')} What the lead and workers will see</span>
              ${d.summaryText.trim() ? `<div class="provenance">From thread “Explore the design”, 19 Nov</div><div class="sm">${esc(d.summaryText)}</div>` : '<div class="sm muted">Nothing. The lead starts with no context.</div>'}</div></section>
        </div>
        <footer><span class="why">${!d.name.trim() ? 'Name the room to continue.' : !runs.length ? 'Choose at least one environment that runs tasks.' : `Ready. Lead on ${d.host}; ${runs.join(' and ')} run${runs.length > 1 ? '' : 's'} tasks.`}</span><button class="btn" data-act="dclose">Cancel</button><button class="btn pri" data-act="create" ${ok ? '' : 'disabled'}>Create room</button></footer>
      </div></div>`;
      }
      if (d.type === 'archive') {
        return `<div class="scrim" data-act="dclose-scrim"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="ar-t" style="width:min(480px,100%)">
        <header><h2 id="ar-t">Archive “${esc(room().name)}”?</h2><p>The room becomes read-only.</p></header>
        <div class="db"><div class="choice">
          <div class="sm">2 tasks are still running, on Laptop and Desktop.</div>
          <label class="radio"><input type="radio" name="ar" value="stop" checked><span class="grow">Stop them<span class="sub" style="font-family:var(--sans)">Desktop is unreachable, so its stop stays unconfirmed until it reconnects.</span></span></label>
          <label class="radio"><input type="radio" name="ar" value="keep"><span class="grow">Leave them running<span class="sub" style="font-family:var(--sans)">Their results can still be reviewed from the archived room.</span></span></label>
          <div class="xs muted">Worktrees, clones and sessions on Server, Laptop and Desktop are not deleted.</div></div></div>
        <footer><button class="btn" data-act="dclose">Cancel</button><button class="btn pri" data-act="do-archive">Archive room</button></footer></div></div>`;
      }
      if (d.type === 'addenv') {
        return `<div class="scrim" data-act="dclose-scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ae-t" style="width:min(440px,100%)">
        <header><h2 id="ae-t">Add an environment</h2><p>It joins to run tasks. The lead is told; nobody else is woken.</p></header>
        <div class="db"><div class="choice">${['Desktop'].map((n) => `<label class="radio"><input type="radio" name="ae" value="${n}" checked><span class="grow">${n}<span class="sub" style="font-family:var(--sans)">Linux, GPU · ${envs[n].online ? 'online' : 'offline: it joins when it reconnects'}</span></span></label>`).join('')}</div></div>
        <footer><button class="btn" data-act="dclose">Cancel</button><button class="btn pri" data-act="dclose" data-toast="Use “Agents work together” to see what happens when Desktop joins.">Add</button></footer></div></div>`;
      }
      if (d.type === 'session') {
        const t = S.tasks.find((x) => x.id === d.task);
        const a = agents[t.agent];
        return `<div class="scrim" data-act="dclose-scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ws-t" style="width:min(480px,100%)">
        <header><h2 id="ws-t">Work session · ${esc(t.title)}</h2><p>${a.name} · ${a.env} · read-only</p></header>
        <div class="db"><div class="term">read libs/threads/feature-sidebar/src/lib/thread-sidebar.html<br>edit thread-sidebar.html  +42 −3<br>bash pnpm nx test threads-feature-sidebar → 58 passed</div><div class="xs muted">You own ${a.env}, so its transcript opens here. It is not copied into the room.</div></div>
        <footer><button class="btn" data-act="dclose">Close</button></footer></div></div>`;
      }
      return '';
    }

    function render() {
      const ae = document.activeElement;
      const keepDraft = (ae && ae.id === 'draft') || S.focusDraft;
      S.focusDraft = false;
      const list = S.convo[selId()] || [];
      let items = '';
      for (let i = 0; i < list.length;) {
        if (list[i].k === 'a2a') {
          let j = i;
          while (j < list.length && list[j].k === 'a2a') j++;
          const run = list.slice(i, j);
          items +=
            run.length >= 3
              ? `<details class="a2a-group" ${j === list.length || list[j].k === 'guard' ? 'open' : ''}><summary>${ic('agents', 's14')}Agents exchanged ${run.length} messages<span class="muted xs">${[...new Set(run.flatMap((r) => [r.from, r.to]))].join(', ')}</span></summary>${run.map(a2aRow).join('')}</details>`
              : run.map(a2aRow).join('');
          i = j;
        } else {
          items += item(list[i]);
          i++;
        }
      }
      document.getElementById('shell').innerHTML =
        `${sidebar()}<main class="main">${header()}<div class="body"><div class="transcript" id="tr">${items}</div>${composer()}</div></main>${panel()}${status()}`;
      document.getElementById('layer').innerHTML =
        dialog() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
      if (keepDraft) {
        const ta = document.getElementById('draft');
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
      const tr = document.getElementById('tr');
      if (tr && S.scroll !== false) tr.scrollTop = tr.scrollHeight;
      S.scroll = true;
    }

    function toast(t) {
      S.toast = t;
      render();
      clearTimeout(toast.h);
      toast.h = setTimeout(() => {
        S.toast = null;
        render();
      }, 2600);
    }

    function open(sel) {
      S.mode = sel.startsWith('room:') ? 'rooms' : 'threads';
      S.drawer = false;
      if (sel === S.sel) {
        render();
        return;
      }
      S.sel = sel;
      S.draft = '';
      S.menu = null;
      S.route = 'lead';
      if (S.panel && (sel.startsWith('room:') ? S.panel !== 'work' : S.panel === 'work')) S.panel = null;
      const r = S.rooms.find((x) => 'room:' + x.id === sel);
      if (r) r.unread = 0;
      render();
    }

    function pauseAgents(title, text) {
      S.paused = true;
      S.pauseWhy = title;
      S.convo.xm.push({ k: 'guard', title, text });
      render();
      document.getElementById('guard')?.scrollIntoView({ block: 'center' });
    }

    function send() {
      const text = S.draft.trim();
      if (!text) return;
      const key = selId();
      if (!isRoom()) {
        S.convo[key].push({ k: 'msg', who: 'You', me: true, text });
        S.draft = '';
        render();
        setTimeout(() => {
          S.convo[key].push({ k: 'msg', who: 'Assistant', env: 'This Mac', text: 'Noted.' });
          render();
        }, 700);
        return;
      }
      const a = target();
      S.convo[key].push({ k: 'msg', who: 'You', me: true, text, routed: a ? a.name : 'no agent' });
      S.hops = 0;
      S.draft = '';
      if (a && !a.online) {
        S.convo[key].push({
          k: 'note',
          text: `Queued for ${a.name} · ${a.env}. It is delivered when ${a.env} reconnects.`,
        });
        S.route = 'lead';
        render();
        return;
      }
      if (!a) {
        render();
        return;
      }
      S.convo[key].push({ k: 'thinking', who: a.name, env: a.env, id: a.id });
      render();
      setTimeout(() => {
        const arr = S.convo[key];
        const idx = arr.findIndex((m) => m.k === 'thinking' && m.id === a.id);
        const reply =
          a.id === 'lead'
            ? 'Got it. I can propose a follow-up task. Nothing runs until you approve it.'
            : S.deliver === 'steer'
              ? 'Steering: switching to that now.'
              : 'Queued as a follow-up after the current step.';
        if (idx >= 0) arr.splice(idx, 1, { k: 'msg', who: a.name, env: a.env, text: reply });
        render();
      }, 800);
    }

    function runExchange() {
      const steps = [
        {
          from: 'Tester',
          fromEnv: 'Desktop',
          to: 'Lead',
          toEnv: 'Server',
          kind: 'question',
          text: 'Which watcher backend does This Mac use: fsevents or polling?',
        },
        {
          from: 'Lead',
          fromEnv: 'Server',
          to: 'Tester',
          toEnv: 'Desktop',
          kind: 'answer',
          text: 'fsevents, per the shared summary. Use inotify on Linux.',
        },
        {
          from: 'Tester',
          fromEnv: 'Desktop',
          to: 'Lead',
          toEnv: 'Server',
          kind: 'question',
          text: 'Test 14 times out on inotify. Is that known on macOS too?',
        },
        {
          from: 'Lead',
          fromEnv: 'Server',
          to: 'Worker',
          toEnv: 'Laptop',
          kind: 'request',
          text: 'Does test 14 time out on Laptop?',
        },
        {
          from: 'Worker',
          fromEnv: 'Laptop',
          to: 'Lead',
          toEnv: 'Server',
          kind: 'answer',
          text: 'No, it passes in 2.1s on macOS.',
        },
        {
          from: 'Lead',
          fromEnv: 'Server',
          to: 'Tester',
          toEnv: 'Desktop',
          kind: 'answer',
          text: 'Linux only, then. Raise fs.inotify.max_user_watches in the test setup and rerun.',
        },
      ];
      toast('Workers talk only to Lead. Worker and Tester never wake each other directly.');
      steps.forEach((st, i) =>
        setTimeout(
          () => {
            if (S.paused) return;
            S.hops++;
            S.turns++;
            S.spend += 0.02;
            S.convo.xm.push({ k: 'a2a', ...st });
            S.scroll = true;
            render();
            if (S.hops >= LIMITS.hops)
              setTimeout(() => {
                pauseAgents(
                  'hop limit',
                  `Agents exchanged ${LIMITS.hops} messages without you. Queued messages wait until you decide.`,
                );
                toast('Hop limit reached: agents pause and ask you.');
              }, 500);
          },
          900 * (i + 1),
        ),
      );
    }

    document.addEventListener('click', (e) => {
      const t = e.target.closest('button, [data-act], .scrim');
      if (!t) {
        if (S.menu) {
          S.menu = null;
          render();
        }
        return;
      }
      if (t.classList.contains('scrim') && e.target !== t) return;
      const d = t.dataset;
      if (d.mode) {
        S.mode = d.mode;
        S.scroll = false;
        render();
        return;
      }
      if (d.open) {
        open(d.open);
        if (d.scroll)
          setTimeout(
            () => document.getElementById(d.scroll === 'q' ? 'qcard' : d.scroll)?.scrollIntoView({ block: 'center' }),
            30,
          );
        return;
      }
      if (d.panel) {
        S.panel = S.panel === d.panel ? null : d.panel;
        S.menu = null;
        S.scroll = false;
        render();
        return;
      }
      if (d.filter) {
        S.filter = d.filter;
        S.menu = null;
        render();
        return;
      }
      if (d.route) {
        S.route = d.route;
        S.menu = null;
        render();
        document.getElementById('draft')?.focus();
        return;
      }
      if (d.answer) {
        const q = S.convo.xm.find((m) => m.k === 'q');
        q.answered = d.answer;
        S.rooms[0].dot = 'run';
        S.scroll = false;
        render();
        toast('Answer posted to the room. Only Worker was prompted.');
        return;
      }
      if (d.task) {
        S.panel = 'work';
        S.scroll = false;
        render();
        setTimeout(() => document.getElementById('card-' + d.task)?.scrollIntoView({ block: 'center' }), 30);
        return;
      }
      if (d.stop) {
        const tk = S.tasks.find((x) => x.id === d.stop);
        tk.task = 'stop-req';
        S.scroll = false;
        render();
        if (tk.presence === 'online')
          setTimeout(() => {
            tk.task = 'stopped';
            render();
            toast(`${agents[tk.agent].name} confirmed the stop.`);
          }, 1600);
        else toast(`Stop requested. ${agents[tk.agent].env} is unreachable, so it is not confirmed.`);
        return;
      }
      if (d.session) {
        S.dialog = { type: 'session', task: d.session };
        render();
        return;
      }
      switch (d.act) {
        case 'pause':
          S.paused = true;
          S.pauseWhy = 'you paused them';
          S.scroll = false;
          render();
          toast('Agents paused. Running turns finish; nothing new starts.');
          return;
        case 'resume': {
          S.paused = false;
          S.hops = 0;
          const g = S.convo.xm.find((m) => m.k === 'guard' && !m.done);
          if (g) g.done = 'You chose Continue. Hop count reset.';
          S.scroll = false;
          render();
          toast('Agents resumed.');
          return;
        }
        case 'takeover': {
          S.paused = false;
          S.hops = 0;
          const g = S.convo.xm.find((m) => m.k === 'guard' && !m.done);
          if (g) g.done = 'You took over. Agents wait for your message.';
          S.route = 'tester';
          S.focusDraft = true;
          render();
          return;
        }
        case 'approve': {
          const p = pendingProp();
          if (!p) return;
          p.done = 'You approved it. Tester is running it on Desktop.';
          S.tasks.push({
            id: 't4',
            title: p.title,
            agent: 'tester',
            branch: 'task/watcher-linux',
            base: p.base,
            presence: 'online',
            task: 'running',
            integ: 'Not submitted',
            mins: 0,
            turns: 1,
            cost: '$0.01',
            ring: 10,
          });
          S.convo.xm.push({
            k: 'ev',
            icon: 'check',
            cls: 'ok',
            text: `You approved “${p.title}” for <b>Tester</b>`,
            loc: 'Desktop · base ' + p.base,
            act: 'Open task',
            task: 't4',
          });
          render();
          runExchange();
          return;
        }
        case 'decline': {
          const p = pendingProp();
          if (p) p.done = 'You declined. Nothing runs.';
          render();
          return;
        }
        case 'route':
          S.menu = S.menu === 'route' ? null : 'route';
          S.scroll = false;
          render();
          return;
        case 'deliver':
          S.deliver = S.deliver === 'steer' ? 'follow-up' : 'steer';
          render();
          return;
        case 'search-open':
          S.searchOpen = true;
          S.menu = null;
          render();
          focusSearch();
          return;
        case 'search-close':
          S.searchOpen = false;
          S.search = '';
          render();
          document.querySelector('[data-act="search-open"]')?.focus();
          return;
        case 'filter':
          S.menu = S.menu === 'filter' ? null : 'filter';
          render();
          return;
        case 'hmenu':
          S.menu = S.menu === 'hmenu' ? null : 'hmenu';
          S.scroll = false;
          render();
          return;
        case 'send':
          send();
          return;
        case 'to-lead':
          S.route = 'lead';
          render();
          return;
        case 'collapse':
          S.collapsed = !S.collapsed;
          render();
          return;
        case 'drawer':
          S.drawer = !S.drawer;
          render();
          return;
        case 'pocket':
          S.panel = S.panel ? null : isRoom() ? 'work' : 'tree';
          render();
          return;
        case 'pclose':
          S.panel = null;
          S.scroll = false;
          render();
          return;
        case 'theme': {
          const r = document.documentElement;
          const dark = r.dataset.theme
            ? r.dataset.theme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = dark ? 'light' : 'dark';
          return;
        }
        case 'start':
          S.menu = null;
          startDialog();
          return;
        case 'archive':
          S.menu = null;
          S.dialog = { type: 'archive' };
          render();
          return;
        case 'addenv':
          S.dialog = { type: 'addenv' };
          render();
          return;
        case 'draftsum':
          S.dialog.summaryText = SUMMARY;
          render();
          return;
        case 'review':
          toast('Opens the existing review mode on the result’s diff. Simulated.');
          return;
        case 'integrate': {
          const tk = S.tasks.find((x) => x.id === d.res);
          tk.task = 'done';
          tk.integ = 'Integrated into main at d4e5f6a';
          const r = S.convo.xm.find((m) => m.k === 'result' && m.task === d.res);
          if (r) r.state = 'Integrated into main at d4e5f6a';
          S.convo.xm.push({
            k: 'ev',
            icon: 'merge',
            cls: 'ok',
            text: `Integrated “${tk.title}”`,
            loc: 'main at d4e5f6a · on Server',
          });
          S.scroll = false;
          render();
          toast('Merged in the integration worktree on Server. Simulated.');
          return;
        }
        case 'dclose': {
          const tt = d.toast;
          S.dialog = null;
          render();
          if (tt) toast(tt);
          return;
        }
        case 'dclose-scrim':
          S.dialog = null;
          render();
          return;
        case 'do-archive':
          S.dialog = null;
          toast('Room archived — simulated. Nothing was deleted on any environment.');
          return;
        case 'create': {
          const dd = S.dialog;
          const id = 'r' + Date.now();
          const runs = Object.keys(dd.runs).filter((k) => dd.runs[k]);
          S.rooms.unshift({ id, name: dd.name.trim(), repo: 'pi-kit', host: dd.host, dot: null, unread: 0 });
          const conv = [];
          if (dd.summaryText.trim())
            conv.push(
              { k: 'prov', text: 'From thread “Explore the design”, 19 Nov · summary' },
              { k: 'msg', who: 'You', me: true, text: dd.summaryText.trim() },
            );
          runs.forEach((n) => conv.push({ k: 'join', who: n, text: 'pi-kit ready at a1b2c3d · runs tasks' }));
          conv.push({
            k: 'msg',
            who: 'Lead',
            env: dd.host,
            text: dd.summaryText.trim()
              ? `Room ready. I only see the summary. I can propose a task for ${runs.join(' or ')}.`
              : 'Room ready. I have no context yet. Tell me what to work on.',
          });
          S.convo[id] = conv;
          S.convo.explore.push({
            k: 'note',
            text: `Shared a summary to room “${esc(dd.name.trim())}”. This thread stays private.`,
          });
          S.dialog = null;
          S.sel = 'room:' + id;
          S.mode = 'rooms';
          S.panel = null;
          S.route = 'lead';
          render();
          toast('Room created — simulated.');
          return;
        }
      }
    });

    function focusSearch() {
      const el = document.getElementById('side-q');
      if (!el) return;
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }

    function startDialog() {
      if (isRoom()) {
        S.sel = 'thread:explore';
        S.mode = 'threads';
        S.panel = null;
      }
      S.dialog = {
        type: 'start',
        name: 'Watcher fix on Linux',
        host: 'Server',
        runs: { Server: false, Laptop: false, Desktop: false },
        summaryText: '',
      };
      render();
    }

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'draft') {
        S.draft = t.value;
        return;
      }
      if (t.id === 'side-q') {
        S.search = t.value;
        render();
        focusSearch();
        return;
      }
      if (!S.dialog) return;
      if (t.id === 'sr-name') {
        S.dialog.name = t.value;
        rerenderKeep(t.id);
      }
      if (t.id === 'sr-sumtext') {
        S.dialog.summaryText = t.value;
        rerenderKeep(t.id);
      }
    });
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (!S.dialog) return;
      if (t.name === 'srhost') {
        S.dialog.host = t.value;
        rerenderKeep(null);
      }
      if (t.dataset.runs) {
        S.dialog.runs[t.dataset.runs] = t.checked;
        rerenderKeep(null);
      }
    });
    function rerenderKeep(id) {
      const el = id && document.getElementById(id);
      const ss = el ? el.selectionStart : 0;
      const sc = document.querySelector('.dlg .db')?.scrollTop || 0;
      render();
      const dl = document.querySelector('.dlg .db');
      if (dl) dl.scrollTop = sc;
      if (id) {
        const n = document.getElementById(id);
        n.focus();
        n.setSelectionRange(ss, ss);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (S.dialog) {
          S.dialog = null;
          render();
          return;
        }
        if (S.menu) {
          S.menu = null;
          render();
          return;
        }
        if (S.searchOpen) {
          S.searchOpen = false;
          S.search = '';
          render();
          document.querySelector('[data-act="search-open"]')?.focus();
          return;
        }
      }
      if (e.target.id === 'draft' && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.querySelector('.tours').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tour]');
      if (!b) return;
      e.stopPropagation();
      S.dialog = null;
      S.menu = null;
      S.draft = '';
      S.route = 'lead';
      const tour = b.dataset.tour;
      if (tour !== 'thread' && tour !== 'start') {
        S.sel = 'room:xm';
        S.mode = 'rooms';
      }
      switch (tour) {
        case 'room':
          S.panel = null;
          render();
          toast('Rooms mode: the sidebar lists rooms only. The switch at the top flips to Threads.');
          break;
        case 'thread':
          S.sel = 'thread:explore';
          S.mode = 'threads';
          S.panel = null;
          render();
          toast('A thread looks exactly like today. Only the sidebar switch is new, and only once a room exists.');
          break;
        case 'peek':
          S.mode = 'threads';
          S.panel = null;
          render();
          toast(
            'The room stays open in the main column; the sidebar now shows threads. The Rooms icon keeps a dot while something waits.',
          );
          break;
        case 'offline':
          S.route = 'tester';
          S.draft = 'Run the Linux suite at a1b2c3d';
          render();
          toast('Tester is offline: post and queue, or route to Lead. Never silently elsewhere.');
          break;
        case 'work':
          S.panel = 'work';
          S.scroll = false;
          render();
          toast('Presence, task and integration are three separate states. Try Stop on both running tasks.');
          break;
        case 'start':
          startDialog();
          toast('Pick who runs tasks, then Draft from thread. Only the summary is shared.');
          break;
        case 'archive':
          S.dialog = { type: 'archive' };
          render();
          break;
        case 'agents': {
          S.panel = null;
          S.paused = false;
          S.hops = 0;
          S.convo.xm = S.convo.xm.filter((m) => !['join', 'a2a', 'guard', 'prop'].includes(m.k) && m.task !== 't4');
          S.tasks = S.tasks.filter((t) => t.id !== 't4');
          agents.tester.online = true;
          envs.Desktop.online = true;
          S.tasks[1].presence = 'online';
          S.convo.xm.push({
            k: 'join',
            who: 'Tester · Desktop',
            text: 'Linux, GPU · pi-kit ready at a1b2c3d · runs tasks',
          });
          render();
          toast('Desktop joined: a join card without a model turn. Only Lead is woken.');
          setTimeout(() => {
            S.convo.xm.push({
              k: 'msg',
              who: 'Lead',
              env: 'Server',
              text: 'Welcome, Tester. I’ll propose the Linux watcher run.',
            });
            S.convo.xm.push({
              k: 'prop',
              title: 'Watcher tests on Linux',
              env: 'Desktop',
              base: 'a1b2c3d',
              criteria: 'watcher e2e passes',
            });
            S.turns++;
            S.spend += 0.02;
            render();
            toast('Nothing runs until you approve. Click Approve.');
          }, 1200);
          break;
        }
      }
    });

    render();
  })();
</script>
